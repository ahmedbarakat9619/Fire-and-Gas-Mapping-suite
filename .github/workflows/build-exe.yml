name: Build portable Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests (EGPC / ISA worked examples)
        run: python -m pytest -q tests

      - name: Build single-file EXE
        run: pyinstaller --noconfirm --clean fgsuite.spec

      - name: Self-test the frozen EXE (demo study, Detect3D hand-over, Word report)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath "dist\FG_Mapping_Suite.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path (Join-Path $out "selftest.ok"))) {
            Get-Content (Join-Path $out "selftest.err") -ErrorAction SilentlyContinue
            throw "Self-test failed (exit $($p.ExitCode))"
          }
          Get-ChildItem $out
          Copy-Item (Join-Path $out "report.docx") dist\Demo_Report.docx
          Copy-Item (Join-Path $out "handover.xlsx") dist\Demo_Detect3D_Handover.xlsx
          Copy-Item (Join-Path $out "demo.fgs") dist\Demo_Project.fgs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FG_Mapping_Suite-windows
          path: |
            dist/FG_Mapping_Suite.exe
            dist/Demo_Report.docx
            dist/Demo_Detect3D_Handover.xlsx
            dist/Demo_Project.fgs
          retention-days: 30

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FG_Mapping_Suite.exe
            dist/Demo_Report.docx
            dist/Demo_Detect3D_Handover.xlsx
            dist/Demo_Project.fgs
